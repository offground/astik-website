<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTIK 한국모험안전기술원</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', sans-serif;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { text-align: center; max-width: 480px; }
        .logo { margin-bottom: 56px; }
        .logo img { height: 48px; }
        .message {
            font-size: 15px;
            color: #999;
            line-height: 1.8;
            margin-bottom: 48px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-home {
            display: inline-block;
            padding: 14px 32px;
            background: #1C2955;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: background .2s;
            min-width: 140px;
        }
        .btn-home:hover { background: #2a3a6a; }
        .btn-home.outline {
            background: transparent;
            color: #1C2955;
            border: 1.5px solid #1C2955;
        }
        .btn-home.outline:hover {
            background: #1C2955;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <a href="/"><img src="/images/logo-horizontal.png" alt="ASTIK 한국모험안전기술원"></a>
        </div>
        <p class="message">
            요청하신 주소는 존재하지 않는 페이지입니다.<br>
            아래에서 원하시는 페이지로 이동해 주세요.<br><br>
            The page you requested does not exist.<br>
            Please select your language below.
        </p>
        <div class="btn-group">
            <a href="/" class="btn-home">한국어</a>
            <a href="/en/" class="btn-home outline">English</a>
            <a href="/ja/" class="btn-home outline">日本語</a>
        </div>
    </div>
</body>
</html>
