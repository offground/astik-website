<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTIK 한국모험안전기술원</title>

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="icon" type="image/png" href="/images/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 480px;
        }
        .logo {
            margin-bottom: 48px;
        }
        .logo img {
            height: 32px;
        }
        .message {
            font-size: 17px;
            font-weight: 500;
            color: #1C2955;
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .message-en {
            font-size: 14px;
            color: #999;
            margin-bottom: 40px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .btn-home {
            display: inline-block;
            padding: 14px 36px;
            background: #1C2955;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
            width: 220px;
        }
        .btn-home:hover {
            background: #2a3a6a;
        }
        .btn-sub {
            display: inline-flex;
            gap: 16px;
            margin-top: 8px;
        }
        .btn-sub a {
            font-size: 14px;
            color: #999;
            text-decoration: none;
            transition: color 0.2s;
        }
        .btn-sub a:hover {
            color: #D94925;
        }
        .btn-sub span {
            color: #ddd;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <a href="/">
                <img src="/images/logo-horizontal.png" alt="ASTIK 한국모험안전기술원">
            </a>
        </div>
        <p class="message">아래에서 원하시는 페이지로 이동해 주세요</p>
        <p class="message-en">Please navigate to the page you're looking for below.</p>
        <div class="btn-group">
            <a href="/" class="btn-home">홈으로 이동 (Home)</a>
            <div class="btn-sub">
                <a href="/courses.html">교육과정</a>
                <span>|</span>
                <a href="/schedule.html">교육일정</a>
                <span>|</span>
                <a href="/contact.html">문의</a>
            </div>
        </div>
    </div>
</body>
</html>
